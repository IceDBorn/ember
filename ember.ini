; ember settings. Missing keys keep these defaults.

[log]
; off, error, warn, info or debug. ember.log next to the DLL holds only the last launch.
level=error

[eventpool]
; Reuse the events of the engine's DLEvent objects instead of creating and closing one per SFX slot.
enabled=1

[sfx]
; Set LoadBalancerParam's SFX reduction levels in the loaded regulation.
enabled=1
; Load balancer level from which each reduction applies. 0 keeps it on all the time; 20 never applies it.
particle_half=0
reflection=0
water_interaction=0
distortion=0
scale_render_distance=0
; How long to look for the loaded param after launch.
scan_seconds=120

[affinity]
; Let these engine worker threads run on every CPU the game may use, once they name themselves.
enabled=1
threads=EWP_LOW_Single_Clus1,EWP_LOW_Cluster00,EWP_LOW_Cluster01,EWP_LOW_Cluster02,EWP_LOW_Cluster03,EWP_HIGHEST_Single_2,EWP_HIGHEST_Fixed_C0,EWP_HIGHEST_Fixed_C1,EWP_HIGHEST_Fixed_C2,EWP_HIGHEST_Fixed_C3,CSGeomModelInsDelay4
; 1 writes a trace of every affinity call to ember-affinity-<pid>.jsonl.
log=0
